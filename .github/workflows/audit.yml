# .github/workflows/audit.yml

name: Sicherheits-Audit & Abhängigkeitsprüfung

on:
  schedule:
    - cron: '0 2 * * 1'  # Jeden Montag um 2:00 Uhr nachts (UTC)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline || npm install

      - name: Sicherheits-Audit (npm audit)
        run: npm audit --production

      - name: Ergebnis als Artefakt bereitstellen
        if: always()
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Audit-Report hochladen
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: backend/npm-audit-report.json
